[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
bytecode_hash = "none"
cbor_metadata = false
viaIR = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
# jitDIEM exceeds EIP-170 at 20k runs; compile it (and anything importing it) at 200 runs (~22.5 KB).
additional_compiler_profiles = [{ name = "jitdiem", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/vault/jitDIEM.sol", max_optimizer_runs = 200 }]


[etherscan]
base = { key = "${ETHERSCAN_API_KEY_1}", url = "https://api.etherscan.io/v2/api?chainid=8453", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY_1}", url = "https://api.etherscan.io/v2/api?chainid=84532", chain = 84532 }

[profile.lplocker]
optimizer_runs = 100

[fmt]
line_length = 100
number_underscore = "thousands"
sort_imports = true
tab_width = 4